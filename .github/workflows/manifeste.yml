# Met à jour manifest.json dès que les versets ou la version du jeu changent.
# Les jeux installés lisent ce manifeste au démarrage et téléchargent les nouveaux versets.
name: Manifeste des mises à jour

on:
  push:
    branches: [main]
    paths:
      - "data/versets.json"
      - "VERSION"
      - "telechargements.json"
      - "tools/manifeste.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifeste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les versets et recalculer le manifeste
        run: python3 tools/manifeste.py

      - name: Enregistrer le manifeste s'il a changé
        run: |
          if git diff --quiet -- manifest.json; then
            echo "Manifeste déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Manifeste mis à jour automatiquement"
          git push
